<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boletim Escolar Pro</title>
<link href="https://googleapis.com" rel="stylesheet">
<style>
  :root { --cor: #4f46e5; --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --muted: #64748b; --border: #e2e8f0; }
  * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
  body { background: radial-gradient(circle at top left, #eef2ff, #f8fafc 45%); margin: 0; padding: 24px 16px; color: var(--text); min-height: 100vh; }
  .box { max-width: 1180px; margin: 0 auto; background: var(--card); border-radius: 24px; box-shadow: 0 20px 40px -15px rgba(15,23,42,.1); overflow: hidden; border: 1px solid rgba(226,232,240,.9); }
  .topo { background: linear-gradient(125deg, #0f172a 0%, #1e1b4b 50%, #3730a3 100%); color: #fff; padding: 28px 34px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; }
  .topo h1 { margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.02em; }
  .topo p { margin: 4px 0 0; font-size: 13.5px; color: #c7d2fe; }
  .topo-controles { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .turma-box { display: flex; align-items: center; background: rgba(255,255,255,.1); backdrop-filter: blur(8px); padding: 5px 8px 5px 14px; border-radius: 14px; border: 1px solid rgba(255,255,255,.18); gap: 6px; }
  .turma-box label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: #c7d2fe; }
  .turma-box select { background: transparent; color: #fff; border: none; font-weight: 700; font-size: 14px; padding: 4px; cursor: pointer; outline: none; }
  .turma-box select option { color: #0f172a; background: #fff; }
  .btn-icon { background: rgba(255,255,255,.14); color: #fff; border: none; width: 30px; height: 30px; border-radius: 8px; cursor: pointer; padding: 0; font-size: 14px; transition: .15s; }
  .btn-icon:hover { background: rgba(255,255,255,.28); transform: translateY(-1px); }
  .status-save { background: rgba(16,185,129,.18); border: 1px solid rgba(52,211,153,.35); color: #6ee7b7; padding: 7px 14px; border-radius: 99px; font-size: 12.5px; font-weight: 600; }
  .corpo { padding: 28px 34px; }
  .painel { background: #f8fafc; border: 1px solid var(--border); border-radius: 16px; padding: 18px; margin-bottom: 24px; }
  .painel-head { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 13.5px; font-weight: 700; color: #334155; }
  textarea { width: 100%; height: 76px; padding: 12px 14px; border: 1.5px solid #cbd5e1; border-radius: 12px; font-size: 14px; resize: vertical; background: #fff; transition: .15s; }
  textarea:focus { outline: none; border-color: var(--cor); box-shadow: 0 0 0 3px rgba(79,70,229,.12); }
  .acoes { display: flex; gap: 9px; flex-wrap: wrap; margin-top: 14px; align-items: center; }
  button { cursor: pointer; border: none; padding: 10px 15px; border-radius: 11px; font-weight: 600; font-size: 13px; transition: all .15s ease; display: inline-flex; align-items: center; gap: 6px; }
  button:active { transform: scale(0.98); }
  .btn-p { background: #4f46e5; color: #fff; box-shadow: 0 4px 12px rgba(79,70,229,.25); } .btn-p:hover { background: #4338ca; }
  .btn-e { background: #10b981; color: #fff; box-shadow: 0 4px 12px rgba(16,185,129,.22); } .btn-e:hover { background: #059669; }
  .btn-s { background: #fff; color: #334155; border: 1px solid #cbd5e1; } .btn-s:hover { background: #f1f5f9; border-color: #94a3b8; }
  .btn-d { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; margin-left: auto; } .btn-d:hover { background: #fee2e2; }
  .corte-box { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: #475569; background: #fff; padding: 6px 12px; border-radius: 11px; border: 1px solid #cbd5e1; }
  .corte-box input { width: 50px; padding: 3px; border: 1px solid #cbd5e1; border-radius: 6px; text-align: center; font-weight: 700; color: #0f172a; }
  .abas-wrap { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; background: #f1f5f9; padding: 7px; border-radius: 15px; border: 1px solid var(--border); margin-bottom: 22px; }
  .abas { display: flex; gap: 6px; flex-wrap: wrap; }
  .tab { background: transparent; color: #475569; padding: 9px 15px; border-radius: 11px; font-weight: 600; }
  .tab:hover { background: rgba(255,255,255,.7); color: #0f172a; }
  .tab.ativa { background: var(--cor); color: #fff; box-shadow: 0 4px 10px rgba(0,0,0,.15); }
  .btn-add { background: #fff; color: #4f46e5; border: 1px dashed #a5b4fc; padding: 8px 13px; font-size: 12.5px; } .btn-add:hover { background: #eef2ff; }
  .barra-mat { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
  .mat-tit { display: flex; align-items: center; gap: 10px; }
  .mat-tit h2 { margin: 0; font-size: 21px; font-weight: 800; color: var(--cor); letter-spacing: -0.01em; }
  .btn-del-mat { background: transparent; color: #94a3b8; padding: 5px 9px; font-size: 12px; } .btn-del-mat:hover { background: #fee2e2; color: #dc2626; }
  .resumo { display: flex; gap: 8px; flex-wrap: wrap; font-size: 12.5px; font-weight: 700; }
  .pill { padding: 6px 13px; border-radius: 99px; background: #f1f5f9; color: #475569; }
  .pill.ap { background: #dcfce7; color: #15803d; }
  .pill.rp { background: #fee2e2; color: #b91c1c; }
  .pill.and { background: #fef3c7; color: #b45309; }
  .tab-wrap { border: 1px solid var(--border); border-radius: 16px; overflow: auto; max-height: 550px; box-shadow: 0 2px 8px rgba(15,23,42,.03); }
  table { width: 100%; border-collapse: collapse; min-width: 780px; }
  th { position: sticky; top: 0; z-index: 5; background: #f8fafc; color: #475569; font-size: 11.5px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; padding: 14px 8px; border-bottom: 1px solid var(--border); }
  td { padding: 10px 8px; border-bottom: 1px solid #f1f5f9; text-align: center; font-size: 14px; }
  tr:hover td { background: #f8fafc; }
  th:first-child, td:first-child { text-align: left; padding-left: 18px; }
  input.nota { width: 64px; padding: 7px 6px; border: 1.5px solid #cbd5e1; border-radius: 9px; text-align: center; font-weight: 700; font-size: 14px; transition: .15s; }
  input.nota:focus { outline: none; border-color: var(--cor); box-shadow: 0 0 0 3px rgba(79,70,229,.12); }
  input.rec { background: #fffbeb; border-color: #fcd34d; }
  input.falta { width: 58px; background: #f8fafc; }
  .badge { font-weight: 700; padding: 6px 12px; border-radius: 99px; display: inline-block; font-size: 12px; min-width: 54px; }
  .azul { background: #dcfce7; color: #15803d; }
  .verm { background: #fee2e2; color: #dc2626; }
  .amar { background: #fef3c7; color: #b45309; }
  .neutro { background: #f1f5f9; color: #64748b; }
  .empty { padding: 48px 20px; text-align: center; color: var(--muted); border: 1.5px dashed #cbd5e1; border-radius: 16px; background: #f8fafc; }
  .modal-bg { display: none; position: fixed; inset: 0; background: rgba(15,23,42,.55); backdrop-filter: blur(3px); align-items: center; justify-content: center; padding: 16px; z-index: 99; }
  .modal { background: #fff; max-width: 460px; width: 100%; border-radius: 18px; padding: 24px; box-shadow: 0 24px 48px rgba(0,0,0,.22); }
  .modal h3 { margin: 0 0 6px; font-size: 18px; font-weight: 800; }
  .modal p { margin: 0 0 14px; font-size: 13px; color: var(--muted); }
  .campo { margin-bottom: 14px; }
  .campo label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 5px; }
  .campo input { width: 100%; padding: 10px 12px; border: 1.5px solid #cbd5e1; border-radius: 10px; font-size: 14px; }
  .cores { display: flex; gap: 8px; flex-wrap: wrap; }
  .cor-opt { width: 28px; height: 28px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; transition: .15s; }
  .cor-opt.sel { border-color: #0f172a; transform: scale(1.12); }
  .modal-acoes { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  .toast { position: fixed; bottom: 22px; right: 22px; background: #0f172a; color: #fff; padding: 12px 18px; border-radius: 12px; font-size: 13px; font-weight: 600; z-index: 120; opacity: 0; transform: translateY(10px); pointer-events: none; transition: .2s; box-shadow: 0 10px 25px rgba(0,0,0,.2); }
  .toast.show { opacity: 1; transform: translateY(0); }
  @media (max-width: 680px) { .corpo, .topo { padding: 20px; } .btn-d { margin-left: 0; } }
</style>
</head>
<body>
<div class="box">
  <div class="topo">
    <div>
      <h1>📚 Boletim & Controle de Notas</h1>
      <p>Gestão de turmas, notas bimestrais, faltas e recuperação</p>
    </div>
    <div class="topo-controles">
      <div class="turma-box">
        <label for="selTurma">Turma:</label>
        <select id="selTurma" onchange="trocarTurma(this.value)"></select>
        <button type="button" class="btn-icon" title="Nova Turma" onclick="novaTurma()">➕</button>
        <button type="button" class="btn-icon" title="Renomear" onclick="renomearTurma()">✏️</button>
        <button type="button" class="btn-icon" title="Excluir" onclick="excluirTurma()">🗑️</button>
      </div>
      <div class="status-save" id="statusSave">💾 Pronto</div>
    </div>
  </div>
  <div class="corpo">
    <div class="painel">
      <div class="painel-head">
        <span>👥 Lista de Alunos da Turma Atual (um nome por linha)</span>
        <span id="contAlunos" style="color:#64748b">0 alunos</span>
      </div>
      <textarea id="txt" placeholder="Cole os nomes dos alunos aqui (um por linha)..."></textarea>
      <div class="acoes">
        <button type="button" class="btn-p" onclick="carregar()">🔄 Atualizar Lista</button>
        <button type="button" class="btn-s" onclick="exportarBackup()">☁️ Salvar Arquivo</button>
