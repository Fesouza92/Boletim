<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boletim Escolar Pro</title>
<style>
  :root { --cor: #4f46e5; --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --muted: #64748b; --border: #e2e8f0; }
  * { box-sizing: border-box; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  body { background: radial-gradient(circle at top left, #eef2ff, #f8fafc 45%); margin: 0; padding: 24px 16px; color: var(--text); min-height: 100vh; }
  .box { max-width: 1180px; margin: 0 auto; background: var(--card); border-radius: 24px; box-shadow: 0 20px 40px -15px rgba(15,23,42,.1); overflow: hidden; border: 1px solid rgba(226,232,240,.9); }
  .topo { background: linear-gradient(125deg, #0f172a 0%, #1e1b4b 50%, #3730a3 100%); color: #fff; padding: 28px 34px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; }
  .topo h1 { margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.02em; }
  .topo p { margin: 4px 0 0; font-size: 13.5px; color: #c7d2fe; }
  .topo-controles { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .turma-box { display: flex; align-items: center; background: rgba(255,255,255,.1); backdrop-filter: blur(8px); padding: 5px 8px 5px 14px; border-radius: 14px; border: 1px solid rgba(255,255,255,.18); gap: 6px; }
  .turma-box label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: #c7d2fe; }
  .turma-box select { background: transparent; color: #fff; border: none; font-weight: 700; font-size: 14px; padding: 4px; cursor: pointer; outline: none; }
  .turma-box select option { color: #0f172a; background: #fff; }
  .btn-icon { background: rgba(255,255,255,.14); color: #fff; border: none; width: 30px; height: 30px; border-radius: 8px; cursor: pointer; padding: 0; font-size: 14px; transition: .15s; justify-content: center; }
  .btn-icon:hover { background: rgba(255,255,255,.28); transform: translateY(-1px); }
  .status-save { background: rgba(16,185,129,.18); border: 1px solid rgba(52,211,153,.35); color: #6ee7b7; padding: 7px 14px; border-radius: 99px; font-size: 12.5px; font-weight: 600; cursor: pointer; }
  .corpo { padding: 28px 34px; }
  .painel { background: #f8fafc; border: 1px solid var(--border); border-radius: 16px; padding: 18px; margin-bottom: 24px; }
  .painel-head { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 13.5px; font-weight: 700; color: #334155; }
  textarea { width: 100%; height: 76px; padding: 12px 14px; border: 1.5px solid #cbd5e1; border-radius: 12px; font-size: 14px; resize: vertical; background: #fff; transition: .15s; }
  textarea:focus { outline: none; border-color: var(--cor); box-shadow: 0 0 0 3px rgba(79,70,229,.12); }
  .acoes { display: flex; gap: 9px; flex-wrap: wrap; margin-top: 14px; align-items: center; }
  button { cursor: pointer; border: none; padding: 10px 15px; border-radius: 11px; font-weight: 600; font-size: 13px; transition: all .15s ease; display: inline-flex; align-items: center; gap: 6px; }
  button:active { transform: scale(0.98); }
  .btn-p { background: #4f46e5; color: #fff; box-shadow: 0 4px 12px rgba(79,70,229,.25); } .btn-p:hover { background: #4338ca; }
  .btn-e { background: #10b981; color: #fff; box-shadow: 0 4px 12px rgba(16,185,129,.22); } .btn-e:hover { background: #059669; }
  .btn-s { background: #fff; color: #334155; border: 1px solid #cbd5e1; } .btn-s:hover { background: #f1f5f9; border-color: #94a3b8; }
  .btn-d { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; margin-left: auto; } .btn-d:hover { background: #fee2e2; }
  .corte-box { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: #475569; background: #fff; padding: 6px 12px; border-radius: 11px; border: 1px solid #cbd5e1; }
  .corte-box input { width: 50px; padding: 3px; border: 1px solid #cbd5e1; border-radius: 6px; text-align: center; font-weight: 700; color: #0f172a; }
  .abas-wrap { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; background: #f1f5f9; padding: 7px; border-radius: 15px; border: 1px solid var(--border); margin-bottom: 22px; }
  .abas { display: flex; gap: 6px; flex-wrap: wrap; }
  .tab { background: transparent; color: #475569; padding: 9px 15px; border-radius: 11px; font-weight: 600; }
  .tab:hover { background: rgba(255,255,255,.7); color: #0f172a; }
  .tab.ativa { background: var(--cor); color: #fff; box-shadow: 0 4px 10px rgba(0,0,0,.15); }
  .btn-add { background: #fff; color: #4f46e5; border: 1px dashed #a5b4fc; padding: 8px 13px; font-size: 12.5px; } .btn-add:hover { background: #eef2ff; }
  .barra-mat { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
  .mat-tit { display: flex; align-items: center; gap: 10px; }
  .mat-tit h2 { margin: 0; font-size: 21px; font-weight: 800; color: var(--cor); letter-spacing: -0.01em; }
  .btn-del-mat { background: transparent; color: #94a3b8; padding: 5px 9px; font-size: 12px; } .btn-del-mat:hover { background: #fee2e2; color: #dc2626; }
  .resumo { display: flex; gap: 8px; flex-wrap: wrap; font-size: 12.5px; font-weight: 700; }
  .pill { padding: 6px 13px; border-radius: 99px; background: #f1f5f9; color: #475569; }
  .pill.ap { background: #dcfce7; color: #15803d; }
  .pill.rp { background: #fee2e2; color: #b91c1c; }
  .pill.and { background: #fef3c7; color: #b45309; }
  .tab-wrap { border: 1px solid var(--border); border-radius: 16px; overflow: auto; max-height: 550px; box-shadow: 0 2px 8px rgba(15,23,42,.03); }
  table { width: 100%; border-collapse: collapse; min-width: 780px; }
  th { position: sticky; top: 0; z-index: 5; background: #f8fafc; color: #475569; font-size: 11.5px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; padding: 14px 8px; border-bottom: 1px solid var(--border); }
  td { padding: 10px 8px; border-bottom: 1px solid #f1f5f9; text-align: center; font-size: 14px; }
  tr:hover td { background: #f8fafc; }
  th:first-child, td:first-child { text-align: left; padding-left: 18px; }
  input.nota { width: 64px; padding: 7px 6px; border: 1.5px solid #cbd5e1; border-radius: 9px; text-align: center; font-weight: 700; font-size: 14px; transition: .15s; }
  input.nota:focus { outline: none; border-color: var(--cor); box-shadow: 0 0 0 3px rgba(79,70,229,.12); }
  input.rec { background: #fffbeb; border-color: #fcd34d; }
  input.falta { width: 58px; background: #f8fafc; }
  .badge { font-weight: 700; padding: 6px 12px; border-radius: 99px; display: inline-block; font-size: 12px; min-width: 54px; }
  .azul { background: #dcfce7; color: #15803d; }
  .verm { background: #fee2e2; color: #dc2626; }
  .amar { background: #fef3c7; color: #b45309; }
  .neutro { background: #f1f5f9; color: #64748b; }
  .empty { padding: 48px 20px; text-align: center; color: var(--muted); border: 1.5px dashed #cbd5e1; border-radius: 16px; background: #f8fafc; }
  .modal-bg { display: none; position: fixed; inset: 0; background: rgba(15,23,42,.55); backdrop-filter: blur(3px); align-items: center; justify-content: center; padding: 16px; z-index: 99; }
  .modal { background: #fff; max-width: 460px; width: 100%; border-radius: 18px; padding: 24px; box-shadow: 0 24px 48px rgba(0,0,0,.22); }
  .modal h3 { margin: 0 0 6px; font-size: 18px; font-weight: 800; }
  .modal p { margin: 0 0 14px; font-size: 13px; color: var(--muted); }
  .campo { margin-bottom: 14px; }
  .campo label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 5px; }
  .campo input { width: 100%; padding: 10px 12px; border: 1.5px solid #cbd5e1; border-radius: 10px; font-size: 14px; }
  .cores { display: flex; gap: 8px; flex-wrap: wrap; }
  .cor-opt { width: 28px; height: 28px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; transition: .15s; }
  .cor-opt.sel { border-color: #0f172a; transform: scale(1.12); }
  .modal-acoes { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  .toast { position: fixed; bottom: 22px; right: 22px; background: #0f172a; color: #fff; padding: 12px 18px; border-radius: 12px; font-size: 13.5px; font-weight: 600; box-shadow: 0 10px 25px rgba(0,0,0,.25); transform: translateY(100px); opacity: 0; transition: all .25s ease; z-index: 200; }
  .toast.show { transform: translateY(0); opacity: 1; }
  @media print {
    body { background: #fff; padding: 0; }
    .box { box-shadow: none; border: none; max-width: 100%; }
    .topo-controles, .painel, .abas-wrap, .btn-del-mat { display: none !important; }
    .tab-wrap { max-height: none; border: 1px solid #cbd5e1; }
  }
</style>
</head>
<body>

<div class="box">
  <header class="topo">
    <div>
      <h1>Boletim Escolar Pro</h1>
      <p>Gestão de notas, faltas e desempenho por turma</p>
    </div>
    <div class="topo-controles">
      <div class="turma-box">
        <label for="sel-turma">Turma</label>
        <select id="sel-turma" onchange="mudarTurma()"></select>
        <button class="btn-icon" title="Nova Turma" onclick="novaTurma()">+</button>
        <button class="btn-icon" title="Renomear Turma" onclick="renomearTurma()">✎</button>
      </div>
      <div class="status-save" id="status-save" title="Clique para forçar sincronização" onclick="salvarDados('Sincronizando com a nuvem...')">☁️ Conectando...</div>
    </div>
  </header>

  <main class="corpo">
    <section class="painel">
      <div class="painel-head">
        <span>📋 Adicionar Alunos em Lote (um nome por linha)</span>
        <span style="color: var(--muted); font-weight: 500;" id="total-alunos-turma">0 alunos</span>
      </div>
      <textarea id="lista-alunos" placeholder="Ex:&#10;Ana Beatriz Silva&#10;Carlos Eduardo Souza&#10;Mariana Oliveira"></textarea>
      <div class="acoes">
        <button class="btn-p" onclick="adicionarAlunos()">+ Adicionar Alunos</button>
        <button class="btn-e" onclick="exportarExcel()">📊 Exportar Excel</button>
        <button class="btn-s" onclick="window.print()">🖨️ Imprimir</button>
        <button class="btn-s" onclick="exportarBackup()">💾 Baixar Backup</button>
        <button class="btn-s" onclick="document.getElementById('input-backup').click()">📂 Carregar Backup</button>
        <input type="file" id="input-backup" accept=".json" style="display:none" onchange="importarBackup(event)">
        <div class="corte-box">
          <span>Nota de Corte:</span>
          <input type="number" id="nota-corte" step="0.5" min="0" max="10" value="6" onchange="atualizarCorte()">
        </div>
        <button class="btn-d" onclick="limparTurma()">🗑️ Limpar Turma</button>
      </div>
    </section>

    <div class="abas-wrap">
      <div class="abas" id="lista-abas"></div>
      <button class="btn-add" onclick="abrirModalMateria()">+ Nova Matéria</button>
    </div>

    <div class="barra-mat">
      <div class="mat-tit">
        <h2 id="titulo-materia">Português</h2>
        <button class="btn-del-mat" onclick="excluirMateria()">Excluir matéria</button>
      </div>
      <div class="resumo" id="resumo-turma"></div>
    </div>

    <div id="area-tabela"></div>
  </main>
</div>

<div class="modal-bg" id="modal-materia">
  <div class="modal">
    <h3>Nova Matéria</h3>
    <p>Escolha o nome e a cor de identificação da disciplina.</p>
    <div class="campo">
      <label for="nome-materia">Nome da Matéria</label>
      <input type="text" id="nome-materia" placeholder="Ex: Artes, Inglês...">
    </div>
    <div class="campo">
      <label>Cor do Tema</label>
      <div class="cores" id="seletor-cores"></div>
    </div>
    <div class="modal-acoes">
      <button class="btn-s" onclick="fecharModalMateria()">Cancelar</button>
      <button class="btn-p" onclick="salvarMateria()">Criar Matéria</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script>
  const FIREBASE_URL = 'https://firebaseio.com';
  const STORAGE_KEY = 'boletim_escolar_4d_v3';
  const PALETA = ['#4f46e5', '#0284c7', '#059669', '#d97706', '#dc2626', '#7c3aed', '#db2777', '#334155'];
  let corSelecionada = PALETA[0];

  const MATERIAS_PADRAO = () => [
    { id: 'm1', nome: 'Português', cor: '#0284c7' },
    { id: 'm2', nome: 'Matemática', cor: '#4f46e5' },
    { id: 'm3', nome: 'História', cor: '#d97706' },
    { id: 'm4', nome: 'Geografia', cor: '#7c3aed' },
    { id: 'm5', nome: 'Ciências', cor: '#059669' }
  ];

  let estado = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
    turmaAtual: 't1',
    turmas: {
      t1: {
        nome: '4º D',
        corte: 6.0,
        materiaAtual: 'm1',
        materias: MATERIAS_PADRAO(),
        alunos: []
      }
    }
  };

  async function carregarDaNuvem() {
    const st = document.getElementById('status-save');
    st.textContent = 'Sincronizando...';
    try {
      const resp = await fetch(FIREBASE_URL);
      if (resp.status === 401 || resp.status === 403) {
        st.textContent = '🔒 Bloqueado no Firebase';
        renderizarTudo();
        return;
      }
      if (!resp.ok) throw new Error('Erro de rede');
      const dadosNuvem = await resp.json();
      if (dadosNuvem && dadosNuvem.turmas) {
        estado = dadosNuvem;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(estado));
      } else if (estado.turmas.t1.alunos.length > 0) {
        await salvarDados();
      }
      st.textContent = '☁️ Conectado';
    } catch (e) {
      st.textContent = '💾 Salvo local (Rede bloqueou nuvem)';
    }
    renderizarTudo();
  }

  async function salvarDados(msgToast = '') {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(estado));
    const st = document.getElementById('status-save');
    st.textContent = 'Salvando...';
    try {
      const resp = await fetch(FIREBASE_URL, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(estado)
      });
      if (resp.status === 401 || resp.status === 403) {
        st.textContent = '🔒 Salvo local (Libere Regras)';
      } else if (!resp.ok) {
        throw new Error('Falha');
      } else {
        st.textContent = '☁️ Salvo na nuvem';
      }
    } catch (e) {
      st.textContent = '💾 Salvo apenas neste aparelho';
    }
    if (msgToast) mostrarToast(msgToast);
  }

  function mostrarToast(texto) {
    const t = document.getElementById('toast');
    t.textContent = texto;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), 2800);
  }

  function getTurma() {
    return estado.turmas[estado.turmaAtual];
  }

  function renderizarTudo() {
    const turma = getTurma();

    const sel = document.getElementById('sel-turma');
    sel.innerHTML = Object.entries(estado.turmas).map(([id, t]) =>
      `<option value="${id}" ${id === estado.turmaAtual ? 'selected' : ''}>${t.nome}</option>`
    ).join('');

    document.getElementById('nota-corte').value = turma.corte;
    document.getElementById('total-alunos-turma').textContent = `${(turma.alunos || []).length} aluno(s)`;

    const abasEl = document.getElementById('lista-abas');
    abasEl.innerHTML = turma.materias.map(m =>
      `<button class="tab ${m.id === turma.materiaAtual ? 'ativa' : ''}" onclick="mudarMateria('${m.id}')">${m.nome}</button>`
    ).join('');

    const mat = turma.materias.find(m => m.id === turma.materiaAtual) || turma.materias[0];
    if (mat) {
      turma.materiaAtual = mat.id;
      document.documentElement.style.setProperty('--cor', mat.cor);
      document.getElementById('titulo-materia').textContent = mat.nome;
    }

    renderizarTabela();
  }

  function calcularDesempenho(notasObj, corte) {
    const vals = [notasObj.b1, notasObj.b2, notasObj.b3, notasObj.b4].filter(v => v !== '' && v !== null && v !== undefined && !isNaN(v)).map(Number);
    if (vals.length === 0) return { media: null, status: 'Em andamento', classe: 'neutro' };

    const soma = vals.reduce((a, b) => a + b, 0);
    let media = soma / vals.length;

    if (vals.length === 4 && media < corte && notasObj.rec !== '' && notasObj.rec !== null && notasObj.rec !== undefined && !isNaN(notasObj.rec)) {
      const rec = Number(notasObj.rec);
      media = Math.max(media, (media + rec) / 2);
    }

    if (vals.length < 4) {
      return { media: media.toFixed(1), status: 'Cursando', classe: 'amar' };
    }
    if (media >= corte) {
      return { media: media.toFixed(1), status: 'Aprovado', classe: 'azul' };
    }
    return { media: media.toFixed(1), status: 'Reprovado', classe: 'verm' };
  }

  function renderizarTabela() {
    const turma = getTurma();
    if (!turma.alunos) turma.alunos = [];
    const area = document.getElementById('area-tabela');
    const resumoEl = document.getElementById('resumo-turma');

    if (turma.alunos.length === 0) {
      resumoEl.innerHTML = '';
      area.innerHTML = `<div class="empty">Nenhum aluno cadastrado nesta turma.<br>Cole os nomes no campo acima e clique em <strong>Adicionar Alunos</strong>.</div>`;
      return;
    }

    let aprovados = 0, reprovados = 0, cursando = 0;

    const linhas = turma.alunos.map((aluno, idx) => {
      if (!aluno.notas) aluno.notas = {};
      if (!aluno.notas[turma.materiaAtual]) {
        aluno.notas[turma.materiaAtual] = { b1: '', b2: '', b3: '', b4: '', rec: '', faltas: 0 };
      }
      const n = aluno.notas[turma.materiaAtual];
      const res = calcularDesempenho(n, turma.corte);

      if (res.status === 'Aprovado') aprovados++;
      else if (res.status === 'Reprovado') reprovados++;
      else cursando++;

      return `
        <tr>
          <td><strong>${aluno.nome}</strong></td>
          <td><input type="number" class="nota" step="0.1" min="0" max="10" value="${n.b1 ?? ''}" onchange="atualizarNota(${idx}, 'b1', this.value)"></td>
          <td><input type="number" class="nota" step="0.1" min="0" max="10" value="${n.b2 ?? ''}" onchange="atualizarNota(${idx}, 'b2', this.value)"></td>
          <td><input type="number" class="nota" step="0.1" min="0" max="10" value="${n.b3 ?? ''}" onchange="atualizarNota(${idx}, 'b3', this.value)"></td>
          <td><input type="number" class="nota" step="0.1" min="0" max="10" value="${n.b4 ?? ''}" onchange="atualizarNota(${idx}, 'b4', this.value)"></td>
          <td><input type="number" class="nota rec" step="0.1" min="0" max="10" value="${n.rec ?? ''}" placeholder="-" onchange="atualizarNota(${idx}, 'rec', this.value)"></td>
          <td><input type="number" class="nota falta" min="0" value="${n.faltas || 0}" onchange="atualizarNota(${idx}, 'faltas', this.value)"></td>
          <td><span class="badge ${res.classe}">${res.media !== null ? res.media : '-'}</span></td>
          <td><span class="badge ${res.classe}">${res.status}</span></td>
        </tr>
      `;
    }).join('');

    resumoEl.innerHTML = `
      <span class="pill">Total: ${turma.alunos.length}</span>
      <span class="pill ap">Aprovados: ${aprovados}</span>
      <span class="pill and">Cursando: ${cursando}</span>
      <span class="pill rp">Reprovados: ${reprovados}</span>
    `;

    area.innerHTML = `
      <div class="tab-wrap">
        <table>
          <thead>
            <tr>
              <th>Aluno</th>
              <th>1º Bim</th>
              <th>2º Bim</th>
              <th>3º Bim</th>
              <th>4º Bim</th>
              <th>Recup.</th>
              <th>Faltas</th>
              <th>Média</th>
              <th>Situação</th>
            </tr>
          </thead>
          <tbody>${linhas}</tbody>
        </table>
      </div>
    `;
  }
  function atualizarNota(idxAluno, campo, valor) {
    const turma = getTurma();
    if (valor !== '' && campo !== 'faltas') {
      valor = Math.max(0, Math.min(10, parseFloat(valor)));
    }
    turma.alunos[idxAluno].notas[turma.materiaAtual][campo] = valor;
    salvarDados();
    renderizarTabela();
  }

  function adicionarAlunos() {
    const txt = document.getElementById('lista-alunos');
    const nomes = txt.value.split('\n').map(n => n.trim()).filter(Boolean);
    if (!nomes.length) return mostrarToast('Digite pelo menos um nome.');

    const turma = getTurma();
    if (!turma.alunos) turma.alunos = [];
    nomes.forEach(nome => {
      turma.alunos.push({ id: 'a_' + Date.now() + Math.random(), nome, notas: {} });
    });
    turma.alunos.sort((a, b) => a.nome.localeCompare(b.nome));
    txt.value = '';
    salvarDados(`${nomes.length} aluno(s) adicionado(s)!`);
    renderizarTudo();
  }

  function mudarTurma() {
    estado.turmaAtual = document.getElementById('sel-turma').value;
    salvarDados();
    renderizarTudo();
  }

  function novaTurma() {
    const nome = prompt('Nome da nova turma (ex: 5º Ano A):');
    if (!nome || !nome.trim()) return;
    const id = 't_' + Date.now();
    estado.turmas[id] = {
      nome: nome.trim(),
      corte: 6.0,
      materiaAtual: 'm1',
      materias: MATERIAS_PADRAO(),
      alunos: []
    };
    estado.turmaAtual = id;
    salvarDados('Turma criada!');
    renderizarTudo();
  }

  function renomearTurma() {
    const turma = getTurma();
    const novo = prompt('Novo nome para a turma:', turma.nome);
    if (!novo || !novo.trim()) return;
    turma.nome = novo.trim();
    salvarDados('Turma renomeada!');
    renderizarTudo();
  }

  function atualizarCorte() {
    const val = parseFloat(document.getElementById('nota-corte').value);
    if (!isNaN(val)) {
      getTurma().corte = val;
      salvarDados('Nota de corte atualizada');
      renderizarTabela();
    }
  }

  function mudarMateria(id) {
    getTurma().materiaAtual = id;
    salvarDados();
    renderizarTudo();
  }

  function abrirModalMateria() {
    document.getElementById('nome-materia').value = '';
    const coresEl = document.getElementById('seletor-cores');
    coresEl.innerHTML = PALETA.map(c =>
      `<div class="cor-opt ${c === corSelecionada ? 'sel' : ''}" style="background:${c}" onclick="selecionarCor('${c}', this)"></div>`
    ).join('');
    document.getElementById('modal-materia').style.display = 'flex';
    document.getElementById('nome-materia').focus();
  }

  function fecharModalMateria() {
    document.getElementById('modal-materia').style.display = 'none';
  }

  function selecionarCor(cor, el) {
    corSelecionada = cor;
    document.querySelectorAll('.cor-opt').forEach(d => d.classList.remove('sel'));
    el.classList.add('sel');
  }

  function salvarMateria() {
    const nome = document.getElementById('nome-materia').value.trim();
    if (!nome) return mostrarToast('Informe o nome da matéria.');
    const turma = getTurma();
    const id = 'm_' + Date.now();
    turma.materias.push({ id, nome, cor: corSelecionada });
    turma.materiaAtual = id;
    fecharModalMateria();
    salvarDados('Matéria adicionada!');
    renderizarTudo();
  }

  function excluirMateria() {
    const turma = getTurma();
    if (turma.materias.length <= 1) return mostrarToast('A turma precisa ter pelo menos uma matéria.');
    if (!confirm('Excluir esta matéria e todas as suas notas?')) return;
    turma.materias = turma.materias.filter(m => m.id !== turma.materiaAtual);
    turma.materiaAtual = turma.materias[0].id;
    salvarDados('Matéria excluída.');
    renderizarTudo();
  }

  function limparTurma() {
    if (!confirm('Apagar TODOS os alunos e notas desta turma?')) return;
    getTurma().alunos = [];
    salvarDados('Turma limpa.');
    renderizarTudo();
  }
  function exportarBackup() {
    const dados = JSON.stringify(estado, null, 2);
    const blob = new Blob([dados], { type: 'application/json' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    const dataHoje = new Date().toISOString().slice(0, 10);
    link.download = `Backup_Boletim_${dataHoje}.json`;
    link.click();
    mostrarToast('Backup salvo! Envie o arquivo para o outro aparelho.');
  }

  function importarBackup(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const importado = JSON.parse(e.target.result);
        if (importado && importado.turmas) {
          estado = importado;
          salvarDados('Dados restaurados com sucesso!');
          renderizarTudo();
        } else {
          mostrarToast('Arquivo de backup inválido.');
        }
      } catch (err) {
        mostrarToast('Erro ao ler o arquivo.');
      }
      event.target.value = '';
    };
    reader.readAsText(file);
  }

  carregarDaNuvem();
</script>
</body>
</html>
