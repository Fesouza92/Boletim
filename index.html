<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boletim Escolar Pro</title>
<link href="https://googleapis.com" rel="stylesheet">
<style>
  :root { --cor: #2563eb; --bg: #f1f5f9; --card: #ffffff; --text: #0f172a; --muted: #64748b; --border: #e2e8f0; }
  * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
  body { background: var(--bg); margin: 0; padding: 20px 14px; color: var(--text); }
  .box { max-width: 1180px; margin: 0 auto; background: var(--card); border-radius: 20px; box-shadow: 0 12px 32px rgba(15,23,42,.08); overflow: hidden; border: 1px solid var(--border); }
  .topo { background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 60%, #2563eb 100%); color: #fff; padding: 24px 30px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 14px; }
  .topo h1 { margin: 0; font-size: 22px; font-weight: 800; }
  .topo p { margin: 4px 0 0; font-size: 13px; color: #cbd5e1; }
  .topo-controles { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .turma-box { display: flex; align-items: center; background: rgba(255,255,255,.12); padding: 4px 6px 4px 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,.2); gap: 6px; }
  .turma-box label { font-size: 11px; font-weight: 700; text-transform: uppercase; color: #e2e8f0; }
  .turma-box select { background: transparent; color: #fff; border: none; font-weight: 700; font-size: 14px; padding: 4px; cursor: pointer; outline: none; }
  .turma-box select option { color: #0f172a; background: #fff; }
  .btn-icon { background: rgba(255,255,255,.15); color: #fff; border: none; width: 28px; height: 28px; border-radius: 7px; cursor: pointer; padding: 0; font-size: 14px; }
  .btn-icon:hover { background: rgba(255,255,255,.3); }
  .status-save { background: rgba(16,185,129,.2); border: 1px solid rgba(16,185,129,.4); color: #a7f3d0; padding: 6px 14px; border-radius: 99px; font-size: 12px; font-weight: 600; }
  .corpo { padding: 24px 30px; }
  .painel { background: #f8fafc; border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 22px; }
  .painel-head { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 13px; font-weight: 700; color: #334155; }
  textarea { width: 100%; height: 74px; padding: 10px 12px; border: 1.5px solid #cbd5e1; border-radius: 10px; font-size: 14px; resize: vertical; }
  textarea:focus { outline: none; border-color: var(--cor); }
  .acoes { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; align-items: center; }
  button { cursor: pointer; border: none; padding: 9px 14px; border-radius: 10px; font-weight: 600; font-size: 13px; transition: .15s; display: inline-flex; align-items: center; gap: 5px; }
  .btn-p { background: #2563eb; color: #fff; } .btn-p:hover { background: #1d4ed8; }
  .btn-e { background: #10b981; color: #fff; } .btn-e:hover { background: #059669; }
  .btn-s { background: #fff; color: #334155; border: 1px solid #cbd5e1; } .btn-s:hover { background: #f1f5f9; }
  .btn-d { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; margin-left: auto; } .btn-d:hover { background: #fee2e2; }
  .corte-box { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: #475569; background: #fff; padding: 5px 10px; border-radius: 10px; border: 1px solid #cbd5e1; }
  .corte-box input { width: 50px; padding: 3px; border: 1px solid #cbd5e1; border-radius: 6px; text-align: center; font-weight: 700; }
  .abas-wrap { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; background: #f8fafc; padding: 8px; border-radius: 14px; border: 1px solid var(--border); margin-bottom: 20px; }
  .abas { display: flex; gap: 6px; flex-wrap: wrap; }
  .tab { background: transparent; color: #475569; padding: 8px 14px; border-radius: 10px; }
  .tab:hover { background: #e2e8f0; }
  .tab.ativa { background: var(--cor); color: #fff; }
  .btn-add { background: #fff; color: #2563eb; border: 1px dashed #93c5fd; padding: 7px 12px; font-size: 12.5px; }
  .barra-mat { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 14px; }
  .mat-tit { display: flex; align-items: center; gap: 8px; }
  .mat-tit h2 { margin: 0; font-size: 20px; font-weight: 800; color: var(--cor); }
  .btn-del-mat { background: transparent; color: #94a3b8; padding: 4px 8px; font-size: 12px; }
  .btn-del-mat:hover { background: #fee2e2; color: #dc2626; }
  .resumo { display: flex; gap: 8px; flex-wrap: wrap; font-size: 12.5px; font-weight: 700; }
  .pill { padding: 5px 12px; border-radius: 99px; background: #f1f5f9; color: #475569; }
  .pill.ap { background: #dcfce7; color: #15803d; }
  .pill.rp { background: #fee2e2; color: #b91c1c; }
  .pill.and { background: #fef3c7; color: #b45309; }
  .tab-wrap { border: 1px solid var(--border); border-radius: 14px; overflow: auto; max-height: 550px; }
  table { width: 100%; border-collapse: collapse; min-width: 780px; }
  th { position: sticky; top: 0; z-index: 5; background: #f8fafc; color: #475569; font-size: 11.5px; text-transform: uppercase; padding: 12px 8px; border-bottom: 1px solid var(--border); }
  td { padding: 9px 8px; border-bottom: 1px solid #f1f5f9; text-align: center; font-size: 14px; }
  tr:hover td { background: #f8fafc; }
  th:first-child, td:first-child { text-align: left; padding-left: 16px; }
  input.nota { width: 62px; padding: 6px; border: 1.5px solid #cbd5e1; border-radius: 8px; text-align: center; font-weight: 700; font-size: 14px; }
  input.nota:focus { outline: none; border-color: var(--cor); }
  input.rec { background: #fffbeb; border-color: #fcd34d; }
  input.falta { width: 56px; background: #f8fafc; }
  .badge { font-weight: 700; padding: 5px 11px; border-radius: 99px; display: inline-block; font-size: 12px; min-width: 50px; }
  .azul { background: #dcfce7; color: #15803d; }
  .verm { background: #fee2e2; color: #dc2626; }
  .amar { background: #fef3c7; color: #b45309; }
  .neutro { background: #f1f5f9; color: #64748b; }
  .empty { padding: 40px 20px; text-align: center; color: var(--muted); border: 1.5px dashed #cbd5e1; border-radius: 14px; background: #f8fafc; }
  .modal-bg { display: none; position: fixed; inset: 0; background: rgba(15,23,42,.55); align-items: center; justify-content: center; padding: 16px; z-index: 99; }
  .modal { background: #fff; max-width: 460px; width: 100%; border-radius: 16px; padding: 22px; box-shadow: 0 20px 40px rgba(0,0,0,.25); }
  .modal h3 { margin: 0 0 6px; font-size: 18px; }
  .modal p { margin: 0 0 12px; font-size: 13px; color: var(--muted); }
  .campo { margin-bottom: 12px; }
  .campo label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 4px; }
  .campo input { width: 100%; padding: 9px 12px; border: 1.5px solid #cbd5e1; border-radius: 9px; font-size: 14px; }
  .cores { display: flex; gap: 8px; flex-wrap: wrap; }
  .cor-opt { width: 28px; height: 28px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; }
  .cor-opt.sel { border-color: #0f172a; transform: scale(1.1); }
  .modal-acoes { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
  .toast { position: fixed; bottom: 20px; right: 20px; background: #0f172a; color: #fff; padding: 11px 16px; border-radius: 10px; font-size: 13px; font-weight: 600; z-index: 120; opacity: 0; transform: translateY(10px); pointer-events: none; transition: .2s; }
  .toast.show { opacity: 1; transform: translateY(0); }
  @media (max-width: 680px) { .corpo, .topo { padding: 18px; } .btn-d { margin-left: 0; } }
</style>
</head>
<body>
<div class="box">
  <div class="topo">
    <div>
      <h1>📚 Boletim & Controle de Notas</h1>
      <p>Gestão de turmas, notas bimestrais, faltas e recuperação</p>
    </div>
    <div class="topo-controles">
      <div class="turma-box">
        <label for="selTurma">Turma:</label>
        <select id="selTurma" onchange="trocarTurma(this.value)"></select>
        <button type="button" class="btn-icon" title="Nova Turma" onclick="novaTurma()">➕</button>
        <button type="button" class="btn-icon" title="Renomear" onclick="renomearTurma()">✏️</button>
        <button type="button" class="btn-icon" title="Excluir" onclick="excluirTurma()">🗑️</button>
      </div>
      <div class="status-save" id="statusSave">💾 Pronto</div>
    </div>
  </div>
  <div class="corpo">
    <div class="painel">
      <div class="painel-head">
        <span>👥 Lista de Alunos da Turma Atual (um nome por linha)</span>
        <span id="contAlunos" style="color:#64748b">0 alunos</span>
      </div>
      <textarea id="txt" placeholder="Cole os nomes dos alunos aqui (um por linha)..."></textarea>
      <div class="acoes">
        <button type="button" class="btn-p" onclick="carregar()">🔄 Atualizar Lista</button>
        <button type="button" class="btn-s" onclick="exportarBackup()">☁️ Salvar Arquivo</button>
        <button type="button" class="btn-s" onclick="document.getElementById('arqBackup').click()">📂 Abrir Arquivo</button>
        <button type="button" class="btn-s" onclick="abrirModalTexto()">📋 Copiar / Colar Código</button>
        <input type="file" id="arqBackup" accept=".json,application/json,text/plain" style="display:none" onchange="importarBackup(event)">
        <button type="button" class="btn-e" onclick="baixarExcel()">📥 Exportar Excel</button>
        <div class="corte-box">
          <label for="corte">Média mín.:</label>
          <input type="number" id="corte" step="0.5" min="1" max="10" value="5" onchange="mudarCorte()">
        </div>
        <button type="button" class="btn-d" onclick="limparTurma()">🗑️ Limpar Turma</button>
      </div>
    </div>
    <div class="abas-wrap">
      <div class="abas" id="listaAbas"></div>
